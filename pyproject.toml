[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-risk-linter"
version = "0.1.6"
description = "Statically lint MCP server source and docs for capability, permission, and disclosure risks."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "AuraOne", email = "opensource@auraone.ai" }]
keywords = [
  "agent-tools",
  "model-context-protocol",
  "mcp",
  "sarif",
  "security",
  "static-analysis",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://auraone.ai/open"
Source = "https://github.com/auraoneai/mcp-risk-linter"
Issues = "https://github.com/auraoneai/mcp-risk-linter/issues"
Documentation = "https://github.com/auraoneai/mcp-risk-linter#readme"
"GitHub Action" = "https://github.com/auraoneai/mcp-risk-linter/blob/main/docs/github-action.md"
Changelog = "https://github.com/auraoneai/mcp-risk-linter/blob/main/CHANGELOG.md"
Security = "https://github.com/auraoneai/mcp-risk-linter/security/policy"

[project.scripts]
mcp-risk-linter = "mcp_risk_linter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
